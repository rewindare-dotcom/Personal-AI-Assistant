name: Brand apply v4
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply
        env:
          PAYLOAD: ''
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD" | base64 -d > scripts/brand_apply.py
          python3 scripts/brand_apply.py
          git config user.name 'brand-bot'
          git config user.email 'brand-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -m 'chore(brand): rename visible product name to Xiaoman'
          git push origin HEAD:main
