name: Xiaoman step one
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply
        env:
          PATCH_B64: ''
          CALL_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/change.patch
          printf '%s' "$CALL_B64" | base64 -d > web/src/screens/CallScreen.tsx
          git apply --verbose /tmp/change.patch
          echo "--- applied ---"
          git status --short
          git config user.name 'xiaoman-bot'
          git config user.email 'xiaoman-bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat(xiaoman): no sign-in, own model only, call screen, no bottom bar'
          git push origin HEAD:main
          git log -1 --format='%H %s'
